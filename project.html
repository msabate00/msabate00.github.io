<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="dynamic-title">Loading Project...</title>
  <meta name="description" id="dynamic-desc" content="">
  
  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/others/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/others/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/others/favicon-16x16.png">
  
  <!-- Styles -->
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"rel="stylesheet"crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
      body{
        background-color: var(--main_black_color);
      }
    </style>
</head>
<body>
  <header class="header">
      <div class="header__content">
        <div class="header__logo-container">
          <div class="header__logo-img-cont">
            <img
              src="./assets/jpeg/marti_sabate.jpg"
              alt="Martí Sabaté Logo Image"
              class="header__logo-img"
            />
          </div>
          <span class="header__logo-sub">Martí Sabaté Miranda</span>
        </div>
        <div class="header__main">
          <ul class="header__links">
            <li class="header__link-wrapper">
              <a href="./index.html" class="header__link"> Home </a>
            </li>
            <li class="header__link-wrapper">
              <a href="./index.html#about" class="header__link">About </a>
            </li>
            <li class="header__link-wrapper">
              <a href="./index.html#projects" class="header__link">
                Projects
              </a>
            </li>
            <li class="header__link-wrapper">
              <a href="./index.html#contact" class="header__link"> Contact </a>
            </li>
          </ul>
          <div class="header__main-ham-menu-cont">
            <img
              src="./assets/svg/ham-menu.svg"
              alt="hamburger menu"
              class="header__main-ham-menu"
            />
            <img
              src="./assets/svg/ham-menu-close.svg"
              alt="hamburger menu close"
              class="header__main-ham-menu-close d-none"
            />
          </div>
        </div>
      </div>
      <div class="header__sm-menu">
        <div class="header__sm-menu-content">
          <ul class="header__sm-menu-links">
            <li class="header__sm-menu-link">
              <a href="./index.html"> Home </a>
            </li>
            <li class="header__sm-menu-link">
              <a href="./index.html#about"> About </a>
            </li>
            <li class="header__sm-menu-link">
              <a href="./index.html#projects"> Projects </a>
            </li>
            <li class="header__sm-menu-link">
              <a href="./index.html#contact"> Contact </a>
            </li>
          </ul>
        </div>
      </div>
    </header>
    <div>
      <p>&nbsp;</p>
    </div>

  <main class="project-main-container">
    <div id="project-content" class="loading-spinner">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox">
    <span class="close-lightbox" onclick="closeLightbox()">&times;</span>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="Screenshot">
    </div>
    <div class="lightbox-nav">
      <button onclick="changeImage(-1)">&#10094;</button>
      <button onclick="changeImage(1)">&#10095;</button>
    </div>
  </div>

  <script src="./js/project-loader.js"></script>
  <script>
    // Obtener ID del proyecto de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id') || 'project-1';
    
    // Cargar proyecto
    loadProject(projectId);
  </script>

  <!-- Header/menu behavior (shared) -->
  <script src="./index.js"></script>
</body>
</html>
